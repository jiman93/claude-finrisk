services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      # Override DB path to use the named volume (absolute path, 4 slashes)
      DATABASE_URL: "sqlite:////finrisk/db/finrisk.db"
      RETRIEVAL_MODE: "tree"
    volumes:
      - db_data:/finrisk/db
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
